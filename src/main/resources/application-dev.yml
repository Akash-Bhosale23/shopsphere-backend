spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopsphere_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
    cache:
      type: redis

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  admin:
    email: admin@shopsphere.com
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  order:
    unpaid-timeout-minutes: 30