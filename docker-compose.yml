services:
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: shopsphere_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: shopsphere-redis-compose
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: shopsphere-rabbitmq-compose
    ports:
      - "5673:5672"
      - "15673:15672"

  mailhog:
    image: mailhog/mailhog
    container_name: shopsphere-mailhog-compose
    ports:
      - "1026:1025"
      - "8026:8025"

  app:
    build: .
    container_name: shopsphere-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8081:8080"

volumes:
  mysql-data: