spring:
  application:
    name: shop-sphere
  profiles:
    active: dev

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized