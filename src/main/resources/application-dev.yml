spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopsphere_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
    cache:
      type: redis

app:
  admin:
    email: admin@shopsphere.com
    password: ${ADMIN_PASSWORD:Admin@12345}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  order:
    unpaid-timeout-minutes: 30